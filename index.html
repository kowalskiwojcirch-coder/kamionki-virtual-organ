<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kamionki Virtual Organ</title>

</head>


<body>

    <h1>
        Kamionki Virtual Organ
    </h1>


    <p id="status">
        Kliknij przycisk, aby uruchomić organy.
    </p>


    <button id="start-audio">
        URUCHOM ORGANY
    </button>


    <hr>


    <h2>
        Rejestry
    </h2>


    <div id="registers">

        <button
            class="register"
            data-register="geingenprincipal"
            aria-pressed="true"
        >
            GEIGENPRINCIPAL 8′
        </button>


        <button
            class="register"
            data-register="sacional"
            aria-pressed="false"
        >
            SALICIONAL 8′
        </button>


        <button
            class="register"
            data-register="gedact"
            aria-pressed="false"
        >
            GEDECKT 8′
        </button>


        <button
            class="register"
            data-register="flute"
            aria-pressed="false"
        >
            FLAUT TRAVERSO 4′
        </button>

    </div>


    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
