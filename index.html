<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kamionki Virtual Organ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #26313d 0%, #11171d 45%, #070a0d 100%);
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }

        .organ {
            width: 100%;
            max-width: 1000px;
            background: rgba(12, 16, 21, .97);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0,0,0,.55);
        }

        header {
            padding: 30px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            margin-top: 7px;
            color: #8995a1;
        }

        .status {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #9ca7b2;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #555;
        }

        .dot.ready {
            background: #6ed39a;
            box-shadow: 0 0 12px rgba(110,211,154,.7);
        }

        main {
            padding: 30px;
        }

        #start-audio {
            width: 100%;
            padding: 17px;
            border: 0;
            border-radius: 12px;
            background: #dcb96b;
            color: #151109;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #start-audio:hover {
            filter: brightness(1.08);
        }

        #start-audio:disabled {
            opacity: .55;
            cursor: default;
        }

        .section-title {
            margin: 30px 0 14px;
            color: #8995a1;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        #registers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .register {
            min-height: 78px;
            padding: 15px 18px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,.07);
            background: #171d24;
            color: #eee;
            display: grid;
            grid-template-columns: 10px 1fr auto;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-align: left;
        }

        .register:hover {
            background: #1e262f;
        }

        .register.active {
            background: linear-gradient(
                135deg,
                rgba(220,185,107,.18),
                rgba(220,185,107,.04)
            );
            border-color: rgba(220,185,107,.45);
        }

        .lamp {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #353c44;
        }

        .register.active .lamp {
            background: #e3c174;
            box-shadow: 0 0 11px rgba(227,193,116,.8);
        }

        .register-name {
            font-weight: bold;
        }

        .register-foot {
            color: #8c98a4;
        }

        .hint {
            margin-top: 18px;
            color: #687480;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 650px) {
            #registers {
                grid-template-columns: 1fr;
            }

            header,
            main {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="organ">

    <header>
        <h1>Kamionki Virtual Organ</h1>

        <div class="subtitle">
            Sample-based virtual organ
        </div>

        <div class="status">
            <span id="status-dot" class="dot"></span>
            <span id="status">Kliknij „Uruchom organy”.</span>
        </div>
    </header>

    <main>

        <button id="start-audio">
            URUCHOM ORGANY
        </button>

        <div class="section-title">
            Rejestry
        </div>

        <div id="registers">

            <button
                class="register active"
                data-register="geingenprincipal"
                aria-pressed="true"
            >
                <span class="lamp"></span>
                <span class="register-name">
                    GEIGENPRINCIPAL
                </span>
                <span class="register-foot">
                    8′
                </span>
            </button>

            <button
                class="register"
                data-register="sacional"
                aria-pressed="false"
            >
                <span class="lamp"></span>
                <span class="register-name">
                    SALICIONAL
                </span>
                <span class="register-foot">
                    8′
                </span>
            </button>

            <button
                class="register"
                data-register="gedact"
                aria-pressed="false"
            >
                <span class="lamp"></span>
                <span class="register-name">
                    GEDECKT
                </span>
                <span class="register-foot">
                    8′
                </span>
            </button>

            <button
                class="register"
                data-register="flute"
                aria-pressed="false"
            >
                <span class="lamp"></span>
                <span class="register-name">
                    FLAUT TRAVERSO
                </span>
                <span class="register-foot">
                    4′
                </span>
            </button>

        </div>

        <div class="hint">
            Po uruchomieniu aktywny jest tylko Geigenprincipal 8′.
            Kolejne głosy możesz dodawać podczas gry.
        </div>

    </main>

</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
